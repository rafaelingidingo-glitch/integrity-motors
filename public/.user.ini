; Integrity Autocars — per-directory PHP limits.
; Read automatically by LiteSpeed and PHP-FPM/CGI (typical on cPanel hosts).
; Apache mod_php ignores this file — set the same values in the hosting
; panel's MultiPHP INI Editor there. The app additionally enforces its own
; 5 MB per-image limit in code.
upload_max_filesize = 10M
post_max_size = 15M
max_execution_time = 120
memory_limit = 256M
